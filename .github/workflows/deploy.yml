name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build -- --base=/juegotheoffice/
      - name: Find and prepare Pages output
        run: |
          mkdir -p pages_out
          FOUND=$(find . -maxdepth 4 -not -path '*/.*' -not -path './node_modules*' \( -name "index.html" -o -name "_shell.html" \) | head -n 1)
          echo "Found entry file: $FOUND"
          if [ -n "$FOUND" ]; then
            DIR=$(dirname "$FOUND")
            cp -r "$DIR"/* pages_out/
            if [ ! -f "pages_out/index.html" ] && [ -f "pages_out/_shell.html" ]; then
              cp pages_out/_shell.html pages_out/index.html
            fi
          else
            find . -maxdepth 3 -not -path './node_modules*'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages_out
      - uses: actions/deploy-pages@v4
