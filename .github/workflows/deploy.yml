name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build -- --base=/juegotheoffice/
      - name: Prepare Pages folder
        run: |
          mkdir -p pages_out
          if [ -d "dist/client" ]; then cp -r dist/client/* pages_out/;
          elif [ -d "dist" ]; then cp -r dist/* pages_out/;
          elif [ -d ".output/public" ]; then cp -r .output/public/* pages_out/; fi
          if [ ! -f "pages_out/index.html" ] && [ -f "pages_out/_shell.html" ]; then
            cp pages_out/_shell.html pages_out/index.html
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages_out
      - uses: actions/deploy-pages@v4
