name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build -- --base=/juegotheoffice/
      - name: Check output folder
        id: check
        run: |
          if [ -d "dist" ]; then echo "dir=dist" >> $GITHUB_OUTPUT;
          elif [ -d ".output/public" ]; then echo "dir=.output/public" >> $GITHUB_OUTPUT;
          else echo "dir=build" >> $GITHUB_OUTPUT; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.check.outputs.dir }}
      - uses: actions/deploy-pages@v4
